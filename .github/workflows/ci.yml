name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt flake8
      - name: Lint with flake8
        run: flake8 python/ run_pipeline.py app/ --max-line-length=120 --ignore=E501,W503,E302,E303,E305,E401,E402,E226,E231,E241,E251,E221,E127,E128,E272,E701,E702,E704,W292,W504,F401,E741
      - name: Generate data
        run: python data/raw/generate_data.py
      - name: Run pipeline
        run: python run_pipeline.py
      - name: Run evaluation-depth analyses (churn calibration, forecast backtest)
        run: |
          python scripts/churn_calibration.py
          python scripts/forecast_backtest.py
      - name: Run pricing & AI-eval modules
        run: |
          python python/pricing/elasticity.py
          python python/pricing/winback.py
          python evals/run_eval.py --min-accuracy 0.90
          python scripts/forecast_challenger.py
          python scripts/inject_pricing_dashboard.py
      - name: Validate dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import re, pathlib, subprocess, tempfile, os, sys
          html = pathlib.Path("dashboard/dashboard.html").read_text(errors="ignore")
          scripts = re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', html, re.S)
          assert scripts, "No inline script blocks found"
          for i, s in enumerate(scripts):
              with tempfile.NamedTemporaryFile(mode='w', suffix='.js', delete=False) as f:
                  f.write(s)
                  tmp = f.name
              r = subprocess.run(['node', '--check', tmp], capture_output=True, text=True)
              os.unlink(tmp)
              if r.returncode != 0:
                  print(f"Inline script block {i} has syntax errors:")
                  print(r.stderr)
                  sys.exit(1)
          print(f"All {len(scripts)} inline script blocks passed node --check")
          PY
          node --check dashboard/decision_engine.js
          node --check dashboard/revenue_pvm_data.js
          echo "All dashboard JavaScript syntax valid"
      - name: Initialize Backend Database Schema
        run: python -c "from app.db.session import init_db; init_db()"
      - name: Run test suite (Data Quality, Econometrics, and API Integration)
        run: |
          set +e
          python -m pytest tests/ -v > pytest.log 2>&1
          status=$?
          tail -n 40 pytest.log
          if [ $status -ne 0 ]; then
            # Surface failures as check-run annotations so they are visible without log access.
            grep -E "^(FAILED|ERROR)" pytest.log | head -n 8 | while IFS= read -r line; do
              echo "::error title=pytest::$(printf '%s' "$line" | cut -c1-900)"
            done
            if ! grep -qE "^(FAILED|ERROR)" pytest.log; then
              echo "::error title=pytest collection error::$(grep -iE 'error' pytest.log | tail -n 1 | cut -c1-900)"
            fi
          fi
          exit $status
