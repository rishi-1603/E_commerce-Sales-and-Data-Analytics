version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: commerce_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: commerce_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/ecommerce_db
      - SYNC_DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/ecommerce_db
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env}
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
